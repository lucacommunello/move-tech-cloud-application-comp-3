apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedidos-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pedidos-api
  template:
    metadata:
      labels:
        app: pedidos-api
    spec:
      imagePullSecrets:
        - name: mgc-registry
      containers:
        - name: pedidos-api
          image: container-registry.br-se1.magalu.cloud/magalu-repo/pedidos-api:v1
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: pedidos-api
spec:
  type: NodePort
  selector:
    app: pedidos-api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
