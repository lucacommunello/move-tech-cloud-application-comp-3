name: CI/CD - build, push e deploy

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install poetry
          poetry install

      - name: Rodar testes
        run: poetry run pytest -v

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ secrets.REGISTRY_SERVER }} -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Build
        run: docker build -t ${{ secrets.REGISTRY_SERVER }}/magalu-repo/pedidos-api:${{ github.sha }} .

      - name: Push
        run: docker push ${{ secrets.REGISTRY_SERVER }}/magalu-repo/pedidos-api:${{ github.sha }}

      - name: Configurar kubectl
        run: |
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > kubeconfig.yaml
          echo "KUBECONFIG=$PWD/kubeconfig.yaml" >> $GITHUB_ENV

      - name: Deploy
        run: |
          kubectl set image deployment/pedidos-api \
            pedidos-api=${{ secrets.REGISTRY_SERVER }}/magalu-repo/pedidos-api:${{ github.sha }}
          kubectl rollout status deployment/pedidos-api
